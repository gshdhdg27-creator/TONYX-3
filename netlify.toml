[build]
  base = "."
  command = "pnpm install --no-frozen-lockfile && pnpm --filter @workspace/mini-app run build"
  publish = "artifacts/mini-app/dist/public"

[build.environment]
  NODE_VERSION = "20"
  PNPM_FLAGS = "--no-frozen-lockfile"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
