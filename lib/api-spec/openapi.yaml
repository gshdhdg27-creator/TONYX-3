openapi: 3.1.0
info:
  title: Api
  # Do not change the title, if the title changes, the import paths will be broken
  version: 0.2.0
  description: AdsGram Telegram Bot API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: users
  - name: ads
  - name: leaderboard
  - name: referrals
  - name: withdrawals
  - name: tasks
  - name: achievements
  - name: bonus
  - name: mini-earn
  - name: mini-market
  - name: mini-games
  - name: mini-tasks
  - name: mini-finance
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /users/register:
    post:
      operationId: registerUser
      tags: [users]
      summary: Register or login a Telegram user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterUserRequest"
      responses:
        "200":
          description: User registered or updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /users/{telegramId}:
    get:
      operationId: getUserProfile
      tags: [users]
      summary: Get user profile and balance
      parameters:
        - name: telegramId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ads/watch:
    post:
      operationId: recordAdWatch
      tags: [ads]
      summary: Record that a user watched an ad and award random coins
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatchAdRequest"
      responses:
        "200":
          description: Coins awarded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchAdResponse"
        "429":
          description: Cooldown active or daily limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ads/status/{telegramId}:
    get:
      operationId: getAdStatus
      tags: [ads]
      summary: Get ad watching status for a user
      parameters:
        - name: telegramId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Ad status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdStatus"

  /leaderboard:
    get:
      operationId: getLeaderboard
      tags: [leaderboard]
      summary: Get top users by coins
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Leaderboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaderboardResponse"

  /referrals/{telegramId}:
    get:
      operationId: getReferrals
      tags: [referrals]
      summary: Get referral info for a user
      parameters:
        - name: telegramId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Referral info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferralInfo"

  /withdrawals:
    post:
      operationId: requestWithdrawal
      tags: [withdrawals]
      summary: Request a withdrawal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawalRequest"
      responses:
        "200":
          description: Withdrawal submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WithdrawalResponse"
        "400":
          description: Insufficient balance or invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /withdrawals/{telegramId}:
    get:
      operationId: getWithdrawals
      tags: [withdrawals]
      summary: Get withdrawal history for a user
      parameters:
        - name: telegramId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Withdrawal history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WithdrawalListResponse"

  /tasks/{telegramId}:
    get:
      operationId: getTasks
      tags: [tasks]
      summary: Get all tasks with completion status for a user
      parameters:
        - name: telegramId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Tasks list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TasksResponse"

  /tasks/complete:
    post:
      operationId: completeTask
      tags: [tasks]
      summary: Complete a task and claim reward
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteTaskRequest"
      responses:
        "200":
          description: Task completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompleteTaskResponse"
        "400":
          description: Task already completed or requirements not met
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /achievements/{telegramId}:
    get:
      operationId: getAchievements
      tags: [achievements]
      summary: Get all achievements with unlock status for a user
      parameters:
        - name: telegramId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Achievements list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AchievementsResponse"

  /bonus/daily/{telegramId}:
    get:
      operationId: getDailyBonusStatus
      tags: [bonus]
      summary: Get daily bonus status
      parameters:
        - name: telegramId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Daily bonus status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyBonusStatus"

  /bonus/daily/claim:
    post:
      operationId: claimDailyBonus
      tags: [bonus]
      summary: Claim daily bonus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimBonusRequest"
      responses:
        "200":
          description: Daily bonus claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimBonusResponse"
        "400":
          description: Already claimed today
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bonus/spin:
    post:
      operationId: luckySpinBonus
      tags: [bonus]
      summary: Spin the lucky wheel (once per day)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimBonusRequest"
      responses:
        "200":
          description: Spin result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpinResponse"
        "400":
          description: Already spun today
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /mini/earn/status/{telegramId}:
    get:
      operationId: getMiniEarnStatus
      tags: [mini-earn]
      summary: Get ad watching status for mini-app
      parameters:
        - name: telegramId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Earn status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MiniEarnStatus"

  /mini/earn/watch:
    post:
      operationId: recordMiniAdWatch
      tags: [mini-earn]
      summary: Record ad watch and award coins (mini-app)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MiniWatchAdInput"
      responses:
        "200":
          description: Coins awarded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MiniAdWatchResult"

  /mini/market/orders:
    get:
      operationId: getMiniMarketOrders
      tags: [mini-market]
      summary: List open market orders
      responses:
        "200":
          description: Market orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MiniMarketOrderList"
    post:
      operationId: createMiniMarketOrder
      tags: [mini-market]
      summary: Create a sell order for coins
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MiniMarketOrderInput"
      responses:
        "200":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MiniMarketOrder"

  /mini/market/orders/{id}:
    delete:
      operationId: cancelMiniMarketOrder
      tags: [mini-market]
      summary: Cancel a market order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Order cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MiniMarketOrder"

  /mini/market/orders/{id}/buy:
    post:
      operationId: buyMiniMarketOrder
      tags: [mini-market]
      summary: Buy a market order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MiniOrderBuyInput"
      responses:
        "200":
          description: Order purchased
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MiniMarketOrder"

  /mini/games/spin/rooms:
    get:
      operationId: getMiniSpinRooms
      tags: [mini-games]
      summary: List open spin rooms
      responses:
        "200":
          description: Spin rooms
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MiniSpinRoomList"
    post:
      operationId: createMiniSpinRoom
      tags: [mini-games]
      summary: Create a new PvP spin room
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MiniSpinRoomInput"
      responses:
        "200":
          description: Room created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MiniSpinRoom"

  /mini/games/spin/rooms/{id}:
    get:
      operationId: getMiniSpinRoom
      tags: [mini-games]
      summary: Get spin room details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Spin room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MiniSpinRoom"

  /mini/games/spin/rooms/{id}/join:
    post:
      operationId: joinMiniSpinRoom
      tags: [mini-games]
      summary: Join a PvP spin room
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MiniSpinJoinInput"
      responses:
        "200":
          description: Joined room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MiniSpinRoom"

  /mini/games/mines/start:
    post:
      operationId: startMineGame
      tags: [mini-games]
      summary: Start a Mines game
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MineGameInput"
      responses:
        "200":
          description: Game started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MineGame"

  /mini/games/mines/reveal:
    post:
      operationId: revealMineCell
      tags: [mini-games]
      summary: Reveal a cell in Mines game
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MineCellInput"
      responses:
        "200":
          description: Cell revealed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MineCellResult"

  /mini/games/mines/cashout:
    post:
      operationId: cashoutMineGame
      tags: [mini-games]
      summary: Cash out winnings from Mines game
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MineCashoutInput"
      responses:
        "200":
          description: Cashed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MineCashoutResult"

  /mini/games/mines/{gameId}:
    get:
      operationId: getMineGame
      tags: [mini-games]
      summary: Get Mines game state
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Game state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MineGame"

  /mini/tasks/{telegramId}:
    get:
      operationId: getMiniTasks
      tags: [mini-tasks]
      summary: List all tasks for the mini-app
      parameters:
        - name: telegramId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Tasks list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MiniTaskList"

  /mini/tasks:
    post:
      operationId: createMiniTask
      tags: [mini-tasks]
      summary: Create a new task (advertiser)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MiniTaskInput"
      responses:
        "200":
          description: Task created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MiniTask"

  /mini/tasks/{id}/complete:
    post:
      operationId: completeMiniTask
      tags: [mini-tasks]
      summary: Complete a task and claim reward
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MiniTaskCompleteInput"
      responses:
        "200":
          description: Task completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MiniTaskCompleteResult"

  /mini/exchange:
    post:
      operationId: exchangeMiniCoins
      tags: [mini-finance]
      summary: Exchange coins to TON
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MiniExchangeInput"
      responses:
        "200":
          description: Exchange successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MiniExchangeResult"

  /mini/withdraw:
    post:
      operationId: requestMiniWithdraw
      tags: [mini-finance]
      summary: Request a TON withdrawal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MiniWithdrawInput"
      responses:
        "200":
          description: Withdrawal submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MiniWithdrawResult"

  /mini/market/pool:
    get:
      operationId: getMiniMarketPool
      tags: [mini]
      summary: Get primary market pool status
      responses:
        "200":
          description: pool state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MiniMarketPool"

  /mini/market/reserve:
    post:
      operationId: reserveMiniMarketPool
      tags: [mini]
      summary: Reserve coins from primary market pool
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MiniMarketReserveInput"
      responses:
        "200":
          description: reservation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MiniMarketReserveResult"

  /mini/history/{telegramId}:
    get:
      operationId: getMiniHistory
      tags: [mini]
      summary: Combined activity history
      parameters:
        - in: path
          name: telegramId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MiniHistory"

  /mini/leaderboard:
    get:
      operationId: getMiniLeaderboard
      tags: [mini]
      summary: Get leaderboard
      parameters:
        - in: query
          name: category
          schema:
            type: string
            enum: [top_earn, top_players, referrals]
        - in: query
          name: telegramId
          schema:
            type: string
      responses:
        "200":
          description: leaderboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MiniLeaderboard"

  /mini/withdraw/{telegramId}:
    get:
      operationId: getMiniWithdrawals
      tags: [mini-finance]
      summary: Get withdrawal history
      parameters:
        - name: telegramId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Withdrawal history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MiniWithdrawList"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        cooldownSeconds:
          type: integer
      required: [error]

    RegisterUserRequest:
      type: object
      properties:
        telegramId:
          type: string
        username:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        photoUrl:
          type: string
        referredBy:
          type: string
        deviceId:
          type: string
      required: [telegramId]

    UserProfile:
      type: object
      properties:
        id:
          type: integer
        telegramId:
          type: string
        username:
          type: string
        firstName:
          type: string
        photoUrl:
          type: string
        coins:
          type: integer
        ton:
          type: number
        tonyxCoins:
          type: integer
        boostRate:
          type: number
        totalAdsWatched:
          type: integer
        totalReferrals:
          type: integer
        isBlocked:
          type: boolean
        isAdmin:
          type: boolean
        depositCode:
          type: string
        warningCount:
          type: integer
        createdAt:
          type: string
          format: date-time
      required: [id, telegramId, coins, ton, tonyxCoins, boostRate, totalAdsWatched, totalReferrals, isBlocked, isAdmin, createdAt]

    WatchAdRequest:
      type: object
      properties:
        telegramId:
          type: string
        blockId:
          type: string
      required: [telegramId]

    WatchAdResponse:
      type: object
      properties:
        coinsEarned:
          type: integer
        newBalance:
          type: integer
        adsWatchedToday:
          type: integer
        cooldownSeconds:
          type: integer
        achievementsUnlocked:
          type: array
          items:
            type: string
      required: [coinsEarned, newBalance, adsWatchedToday, cooldownSeconds, achievementsUnlocked]

    AdStatus:
      type: object
      properties:
        canWatch:
          type: boolean
        cooldownSeconds:
          type: integer
        adsWatchedToday:
          type: integer
        dailyLimit:
          type: integer
        minCoinsPerAd:
          type: integer
        maxCoinsPerAd:
          type: integer
      required: [canWatch, cooldownSeconds, adsWatchedToday, dailyLimit, minCoinsPerAd, maxCoinsPerAd]

    LeaderboardEntry:
      type: object
      properties:
        rank:
          type: integer
        telegramId:
          type: string
        username:
          type: string
        firstName:
          type: string
        coins:
          type: integer
        totalAdsWatched:
          type: integer
      required: [rank, telegramId, coins, totalAdsWatched]

    LeaderboardResponse:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/LeaderboardEntry"
      required: [entries]

    ReferralInfo:
      type: object
      properties:
        referralCode:
          type: string
        referralLink:
          type: string
        totalReferrals:
          type: integer
        referralEarnings:
          type: integer
        referrals:
          type: array
          items:
            $ref: "#/components/schemas/ReferralEntry"
      required: [referralCode, referralLink, totalReferrals, referralEarnings, referrals]

    ReferralEntry:
      type: object
      properties:
        username:
          type: string
        firstName:
          type: string
        joinedAt:
          type: string
          format: date-time
        coinsEarned:
          type: integer
      required: [joinedAt, coinsEarned]

    WithdrawalRequest:
      type: object
      properties:
        telegramId:
          type: string
        amount:
          type: integer
        method:
          type: string
          enum: [USDT, TON, Payeer, BinancePay, Stars]
        address:
          type: string
      required: [telegramId, amount, method, address]

    WithdrawalResponse:
      type: object
      properties:
        id:
          type: integer
        status:
          type: string
        amount:
          type: integer
        method:
          type: string
        message:
          type: string
      required: [id, status, amount, method, message]

    WithdrawalItem:
      type: object
      properties:
        id:
          type: integer
        amount:
          type: integer
        method:
          type: string
        address:
          type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, amount, method, address, status, createdAt]

    WithdrawalListResponse:
      type: object
      properties:
        withdrawals:
          type: array
          items:
            $ref: "#/components/schemas/WithdrawalItem"
        minimumWithdrawal:
          type: integer
      required: [withdrawals, minimumWithdrawal]

    TaskItem:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        reward:
          type: integer
        type:
          type: string
          enum: [subscribe, visit, watch_ads, invite_friends]
        requirement:
          type: integer
        link:
          type: string
        completed:
          type: boolean
        completedAt:
          type: string
          format: date-time
      required: [id, title, description, reward, type, requirement, completed]

    TasksResponse:
      type: object
      properties:
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/TaskItem"
      required: [tasks]

    CompleteTaskRequest:
      type: object
      properties:
        telegramId:
          type: string
        taskId:
          type: string
      required: [telegramId, taskId]

    CompleteTaskResponse:
      type: object
      properties:
        coinsEarned:
          type: integer
        newBalance:
          type: integer
        taskTitle:
          type: string
      required: [coinsEarned, newBalance, taskTitle]

    AchievementItem:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        reward:
          type: integer
        icon:
          type: string
        requirement:
          type: integer
        type:
          type: string
          enum: [watch_ads, invite_friends, earn_coins]
        unlocked:
          type: boolean
        progress:
          type: integer
        unlockedAt:
          type: string
          format: date-time
      required: [id, title, description, reward, icon, requirement, type, unlocked, progress]

    AchievementsResponse:
      type: object
      properties:
        achievements:
          type: array
          items:
            $ref: "#/components/schemas/AchievementItem"
      required: [achievements]

    DailyBonusStatus:
      type: object
      properties:
        canClaim:
          type: boolean
