name: winner-modal-v2
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply
        run: |
          cat .github/scripts/wm_w0.b64 .github/scripts/wm_w1.b64 | base64 -d > artifacts/mini-app/src/components/WinnerModal.tsx
          cat .github/scripts/wm_p0.b64 .github/scripts/wm_p1.b64 | base64 -d > /tmp/wm_patch.py
          python3 /tmp/wm_patch.py
      - name: Commit
        run: |
          git config user.name tonyx-bot
          git config user.email bot@tonyx.local
          git add artifacts/mini-app/src/components/WinnerModal.tsx artifacts/mini-app/src/components/ArenaGame.tsx artifacts/mini-app/src/components/SpinGame.tsx
          git commit -m "feat(pvp): WinnerModal for arena and spin" || exit 0
          git push
