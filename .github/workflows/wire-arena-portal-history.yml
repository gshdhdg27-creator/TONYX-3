name: wire-arena-portal-history
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/wire-arena-portal-history.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire Portal history into ArenaGame
        run: |
          set -eux
          echo '' | base64 -d > /tmp/patch_arena_history.py
          python3 /tmp/patch_arena_history.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/mini-app/src/components/ArenaGame.tsx artifacts/mini-app/src/components/ArenaHistoryModal.tsx
          git status
          git commit -m "feat(arena): Portal-style history modal (filters, replay, fairness)" || echo "no change"
          git push origin HEAD:main
