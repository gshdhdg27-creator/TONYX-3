name: fix-arena-newlines
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix
        run: |
          echo "" > /tmp/p.b64
          echo "" >> /tmp/p.b64
          base64 -d /tmp/p.b64 > /tmp/fix.py
          python3 /tmp/fix.py
      - name: Commit
        run: |
          git config user.name tonyx-bot
          git config user.email bot@tonyx.local
          git add artifacts/mini-app/src/components/ArenaGame.tsx
          git commit -m "fix(arena): repair broken newlines in buildStrips 3+ block" || exit 0
          git push
