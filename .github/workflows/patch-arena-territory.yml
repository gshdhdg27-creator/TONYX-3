name: patch-arena-territory
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-arena-territory.yml'
      - 'scripts/apply-arena-territory.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply territories
        run: |
          python3 scripts/apply-arena-territory.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/mini-app/src/components/ArenaGame.tsx
          git diff --cached --stat
          git commit -m "feat(arena): Portals-style organic territories by stake %" || exit 0
          git push origin HEAD:main
