services:
  - type: web
    name: tonyx-pixel-office
    runtime: docker
    plan: free
    region: frankfurt
    branch: pixel-office-cloud
    rootDir: pixel-office
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeployTrigger: off
    envVars:
      - key: OFFICE_PASSWORD
        generateValue: true
      - key: GITHUB_TOKEN
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: VERCEL_TOKEN
        sync: false
      - key: VERCEL_PROJECT_ID
        sync: false
      - key: VERCEL_TEAM_ID
        sync: false
