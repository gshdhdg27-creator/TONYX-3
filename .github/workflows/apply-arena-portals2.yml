name: apply-arena-portals2
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Write and run patch
        run: |
          echo "" > /tmp/p.b64
          base64 -d /tmp/p.b64 > /tmp/do_patch_arena.py
          python3 /tmp/do_patch_arena.py
      - name: Commit
        run: |
          git config user.name "tonyx-bot"
          git config user.email "bot@tonyx.local"
          git add artifacts/mini-app/src/components/ArenaGame.tsx
          git commit -m "feat(arena): Portals-style diagonal + corner triangle territories" || exit 0
          git push
