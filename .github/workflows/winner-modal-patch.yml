name: winner-modal-patch
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: |
          cat .github/scripts/winner_c0.b64 .github/scripts/winner_c1.b64 .github/scripts/winner_c2.b64 .github/scripts/winner_c3.b64 .github/scripts/winner_c4.b64 .github/scripts/winner_c5.b64 .github/scripts/winner_c6.b64 .github/scripts/winner_c7.b64 | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
      - name: Commit
        run: |
          git config user.name tonyx-bot
          git config user.email bot@tonyx.local
          git add artifacts/mini-app/src/components/ArenaGame.tsx artifacts/mini-app/src/components/SpinGame.tsx
          git commit -m "feat(pvp): winner modal with TON + NFT prizes (arena + spin)" || exit 0
          git push
