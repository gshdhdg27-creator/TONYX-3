name: stake-ui-patch
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply
        run: python3 .github/scripts/stake_ui_patch.py
      - name: Commit
        run: |
          git config user.name tonyx-bot
          git config user.email bot@tonyx.local
          git add artifacts/mini-app/src/components/SpinGame.tsx artifacts/mini-app/src/components/ArenaGame.tsx
          git commit -m "fix(pvp): show TON chips + stake detail in spin and arena" || exit 0
          git push
